name: Refresh profile artwork

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify activity filtering
        run: python -m unittest discover -s tests -v
      - name: Refresh selected public project activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py
      - name: Generate public commit arcade
        run: npm run arcade
      - name: Generate calendar alternative
        run: python scripts/calendar.py
      - name: Validate generated artwork
        run: python scripts/validate.py
      - name: Save updated artwork
        run: |
          git add assets/activity-*.svg assets/arcade/*.svg assets/calendar-*.svg assets/data/*.json
          if git diff --cached --quiet; then
            echo "Public artwork is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh public profile artwork [skip ci]"
          git push
